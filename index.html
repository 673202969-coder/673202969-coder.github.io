<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣味心理测试合集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #2b1a4d 0%, #4a2a7a 50%, #8a4fb8 100%);
    min-height: 100vh; color: #fff; display: flex; justify-content: center; align-items: center;
    background-attachment: fixed; padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .badge { text-align: center; font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,.7); margin-bottom: 10px; }
  h1 { text-align: center; font-size: 28px; margin-bottom: 8px; }
  .sub { text-align: center; font-size: 13px; color: rgba(255,255,255,.6); margin-bottom: 32px; }
  .card {
    display: block; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.22);
    border-radius: 18px; padding: 20px; margin-bottom: 16px; text-decoration: none; color: #fff;
    transition: all .18s ease;
  }
  .card:active { transform: scale(.97); background: rgba(255,255,255,.18); }
  .card .emoji { font-size: 30px; display: inline-block; margin-right: 12px; vertical-align: middle; }
  .card .name { font-size: 18px; font-weight: 700; vertical-align: middle; }
  .card .desc { font-size: 13px; color: rgba(255,255,255,.7); margin-top: 8px; line-height: 1.6; }
  .foot { text-align: center; font-size: 12px; color: rgba(255,255,255,.5); margin-top: 26px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">趣味心理测试</div>
  <h1>今天想测点什么？</h1>
  <p class="sub">1 分钟出结果 · 可保存分享图</p>

  <a class="card" href="test-psychological-age.html">
    <span class="emoji">⏳</span><span class="name">你的心理年龄是多少岁？</span>
    <div class="desc">8 道题测出你灵魂的真实年纪，反差感拉满，测完就想发给朋友。</div>
  </a>

  <a class="card" href="test-personality-animal.html">
    <span class="emoji">🐺</span><span class="name">你内心住着什么动物？</span>
    <div class="desc">唤醒你的灵魂本体：孤狼、黑猫、海豚还是熊猫？看看你和朋友是不是同类。</div>
  </a>

  <a class="card" href="test-love-style.html">
    <span class="emoji">💘</span><span class="name">你的恋爱人格是哪种？</span>
    <div class="desc">看穿你在爱情里的样子，附赠「适合你的另一半」匹配结果，发给 TA 一起测。</div>
  </a>

  <div class="foot">本页面所有测试均为趣味娱乐内容<br>不构成任何专业心理评估</div>
</div>
</body>
</html>
